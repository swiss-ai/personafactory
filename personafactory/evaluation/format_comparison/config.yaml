# Persona-format comparison: endpoints and decoding. Endpoints are placeholders: point base_url at any
# OpenAI-compatible server (.../v1); several entries with the same name are round-robined.
# api_key: ENV=<VAR> reads the key from that environment variable.
seed: 20260901
concurrency: 160

# Rewriter/responder pool. A run uses one family (--responder gemma | ministral) so the rewriter is fixed.
responders:
  - name: gemma
    base_url: http://GEMMA_HOST_1:8080/v1
    api_key: ENV=PF_API_KEY
    model: google/gemma-4-31B-it
  - name: gemma
    base_url: http://GEMMA_HOST_2:8080/v1
    api_key: ENV=PF_API_KEY
    model: google/gemma-4-31B-it
  - name: ministral
    base_url: http://MINISTRAL_HOST_1:8080/v1
    api_key: ENV=PF_API_KEY
    model: mistralai/Ministral-3-14B-Instruct-2512

# Pipeline judge (style, intent, sanity, pairwise); base_urls are round-robined.
judge:
  name: minimax
  base_url: http://MINIMAX_HOST_1:8080/v1
  api_key: ENV=PF_API_KEY
  model: MiniMaxAI/MiniMax-M2.5
  base_urls:
    - http://MINIMAX_HOST_1:8080/v1
    - http://MINIMAX_HOST_2:8080/v1

# Projection model for the PersonaHub-form sentences: neither rewriter nor judge.
projector:
  name: glm
  base_url: http://GLM_HOST:8080/v1
  api_key: ENV=PF_API_KEY
  model: zai-org/GLM-4.7-Flash

rewrite_gen:   {temperature: 0.3, top_p: 0.95, max_tokens: 2048}
respond_gen:   {temperature: 0.7, top_p: 0.95, max_tokens: 2048}
judge_gen:     {temperature: 0.1, top_p: 1.0,  max_tokens: 3072}   # temperature 0.0 sent the reasoning judge into repetition loops
projector_gen: {temperature: 0.3, top_p: 0.95, max_tokens: 128}
verbal_quirks_instruction: ""
